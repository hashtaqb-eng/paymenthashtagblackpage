<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الدفع - Hashtag</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Cairo', sans-serif;
direction: rtl;
background: #0a0a0a;
color: #fff;
padding: 20px;
min-height: 100vh;
}

.container {
max-width: 600px;
margin: 0 auto;
}

h1 {
color: #ff0055;
margin-bottom: 30px;
text-align: center;
font-size: 24px;
}

.card {
background: #111;
border: 1px solid #333;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
}

.card h2 {
color: #ff0055;
font-size: 16px;
margin-bottom: 15px;
border-bottom: 1px solid #333;
padding-bottom: 10px;
}

.loading-spinner {
display: none;
text-align: center;
padding: 40px;
}

.spinner {
border: 4px solid #333;
border-top: 4px solid #ff0055;
border-radius: 50%;
width: 40px;
height: 40px;
animation: spin 1s linear infinite;
margin: 0 auto 15px;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

.error {
display: none;
background: #f44336;
color: white;
padding: 15px;
border-radius: 8px;
margin-bottom: 15px;
text-align: center;
}

.success {
display: none;
background: #4caf50;
color: white;
padding: 15px;
border-radius: 8px;
margin-bottom: 15px;
text-align: center;
}

.items-list {
list-style: none;
margin-bottom: 15px;
}

.items-list li {
display: flex;
justify-content: space-between;
padding: 10px 0;
border-bottom: 1px solid #222;
font-size: 14px;
}

.items-list li:last-child {
border-bottom: none;
}

.total-section {
background: #222;
padding: 15px;
border-radius: 8px;
margin-bottom: 15px;
text-align: center;
}

.total-amount {
font-size: 24px;
font-weight: bold;
color: #ff0055;
}

.form-group {
margin-bottom: 15px;
}

.form-group label {
display: block;
margin-bottom: 5px;
font-weight: bold;
font-size: 14px;
color: #fff;
}

.form-group input,
.form-group select {
width: 100%;
padding: 12px;
border: 1px solid #333;
border-radius: 8px;
background: #222;
color: #fff;
font-family: 'Cairo', sans-serif;
font-size: 14px;
}

.form-group input:focus,
.form-group select:focus {
outline: none;
border-color: #ff0055;
}

.phone-group {
display: flex;
gap: 10px;
}

.phone-group input:first-child {
flex: 0 0 90px;
background: #333;
}

.phone-group input:last-child {
flex: 1;
}

.payment-methods {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-bottom: 15px;
}

.payment-method {
position: relative;
cursor: pointer;
}

.payment-method input[type="radio"] {
display: none;
}

.payment-label {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 15px;
border: 2px solid #333;
border-radius: 8px;
cursor: pointer;
transition: all 0.3s;
background: #222;
}

.payment-method input[type="radio"]:checked + .payment-label {
border-color: #ff0055;
background: rgba(255, 0, 85, 0.1);
}

.payment-icon {
font-size: 28px;
margin-bottom: 8px;
}

.payment-name {
font-weight: bold;
font-size: 13px;
color: #fff;
}

.payment-desc {
font-size: 11px;
color: #999;
margin-top: 5px;
}

.buttons {
display: flex;
gap: 10px;
margin-top: 20px;
}

.btn {
flex: 1;
padding: 14px;
border: none;
border-radius: 8px;
font-family: 'Cairo', sans-serif;
font-weight: bold;
cursor: pointer;
transition: all 0.3s;
font-size: 14px;
}

.btn-primary {
background: #0070ff;
color: #fff;
}

.btn-primary:hover:not(:disabled) {
background: #0056cc;
}

.btn-primary:disabled {
background: #555;
cursor: not-allowed;
}

.btn-secondary {
background: #555;
color: #fff;
}

.btn-secondary:hover {
background: #333;
}

.back-link {
text-align: center;
margin-top: 20px;
}

.back-link a {
color: #0070ff;
text-decoration: none;
font-size: 14px;
}

.back-link a:hover {
text-decoration: underline;
}

.info-box {
background: #222;
border-left: 3px solid #ff0055;
padding: 12px;
border-radius: 4px;
font-size: 13px;
margin-bottom: 15px;
}

.info-box strong {
color: #ff0055;
}
</style>
</head>

<body>

<div class="container">
<h1>🖤 إتمام الدفع</h1>

<div class="error" id="error"></div>
<div class="success" id="success"></div>

<div class="loading-spinner" id="loadingSpinner">
<div class="spinner"></div>
<p>جاري تحميل البيانات...</p>
</div>

<div id="content" style="display: none;">
<!-- 1️⃣ عرض السلة -->
<div class="card">
<h2>🛒 ملخص الطلب</h2>
<ul class="items-list" id="itemsList"></ul>
<div class="total-section">
<span>المجموع:</span>
<div class="total-amount" id="totalAmount">0 AED</div>
</div>
</div>

<!-- 2️⃣ بيانات العميل -->
<div class="card">
<h2>📋 بيانات العميل</h2>

<div class="form-group">
<label>الاسم الكامل *</label>
<input type="text" id="customerName" placeholder="أدخل اسمك الكامل">
</div>

<div class="form-group">
<label>البريد الإلكتروني *</label>
<input type="email" id="customerEmail" placeholder="your@email.com">
</div>

<div class="form-group">
<label>الدولة *</label>
<select id="customerCountry" onchange="updatePhoneCode()">
<option value="">اختر الدولة</option>
<option value="OM" data-code="+968">🇴🇲 عُمان</option>
<option value="AE" data-code="+971">🇦🇪 الإمارات</option>
<option value="SA" data-code="+966">🇸🇦 السعودية</option>
<option value="KW" data-code="+965">🇰🇼 الكويت</option>
<option value="QA" data-code="+974">🇶🇦 قطر</option>
<option value="BH" data-code="+973">🇧🇭 البحرين</option>
</select>
</div>

<div class="form-group">
<label>رقم الهاتف *</label>
<div class="phone-group">
<input type="text" id="phoneCode" value="--" disabled>
<input type="tel" id="customerPhone" placeholder="12345678">
</div>
</div>
</div>

<!-- 3️⃣ طريقة الدفع -->
<div class="card">
<h2>💳 طريقة الدفع</h2>

<div class="payment-methods">
<div class="payment-method">
<input type="radio" id="ngenius" name="paymentMethod" value="ngenius" checked>
<label for="ngenius" class="payment-label">
<div class="payment-icon">💳</div>
<div class="payment-name">nGenius</div>
<div class="payment-desc">دفع فوري ببطاقة</div>
</label>
</div>

<div class="payment-method">
<input type="radio" id="tabby" name="paymentMethod" value="tabby">
<label for="tabby" class="payment-label">
<div class="payment-icon">📅</div>
<div class="payment-name">Tabby</div>
<div class="payment-desc">تقسيط 4 دفعات</div>
</label>
</div>
</div>

<div class="info-box">
<strong>ملاحظة:</strong> اختر طريقة الدفع المفضلة لديك قبل متابعة العملية.
</div>
</div>

<!-- الأزرار -->
<div class="buttons">
<button class="btn btn-primary" id="payBtn" onclick="processPayment()" disabled>✅ إتمام الدفع</button>
<button class="btn btn-secondary" onclick="goBack()">← العودة</button>
</div>
</div>
</div>

<div class="back-link">
<a href="javascript:window.history.back()">العودة إلى المتجر</a>
</div>

<script>
// ✅ رابط Google Apps Script
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbz60Az3a9ufHH4caB39lMc_5FRVZfwnN5cLeXB_0FnVWhVxpv-T4rf4c73n6xtJFA1FuA/usercallback";

let cartData = null;

// ✅ استقبل البيانات من localStorage (بدل fetch!)
function loadCart() {
try {
const stored = localStorage.getItem('pendingCart');
if (!stored) {
showError('لم يتم العثور على بيانات السلة. يرجى العودة والمحاولة مجدداً.');
return;
}

cartData = JSON.parse(stored);
displayCart();
localStorage.removeItem('pendingCart'); // احذفها بعد الاستخدام

document.getElementById('loadingSpinner').style.display = 'none';
document.getElementById('content').style.display = 'block';

} catch (error) {
showError('خطأ في تحميل البيانات: ' + error.message);
}
}

// عرض محتويات السلة
function displayCart() {
const itemsList = document.getElementById('itemsList');
itemsList.innerHTML = '';

if (cartData.items && cartData.items.length > 0) {
cartData.items.forEach((item, index) => {
const li = document.createElement('li');
li.innerHTML = `
<span>${item.name} (${item.size}) x${item.qty}</span>
<span>${(item.price * item.qty).toFixed(2)} AED</span>
`;
itemsList.appendChild(li);
});
}

document.getElementById('totalAmount').textContent = (cartData.total || 0).toFixed(2) + ' AED';
}

// تحديث كود الدول
function updatePhoneCode() {
const select = document.getElementById('customerCountry');
const option = select.options[select.selectedIndex];
const code = option.getAttribute('data-code') || '--';
document.getElementById('phoneCode').value = code;
updatePayButton();
}

// تفعيل/تعطيل زر الدفع
function updatePayButton() {
const name = document.getElementById('customerName').value.trim();
const email = document.getElementById('customerEmail').value.trim();
const country = document.getElementById('customerCountry').value;
const phone = document.getElementById('customerPhone').value.trim();

const isValid = name && email && country && phone.length >= 8;
document.getElementById('payBtn').disabled = !isValid;
}

// إضافة مستمعين للمدخلات
document.addEventListener('DOMContentLoaded', () => {
document.getElementById('customerName').addEventListener('input', updatePayButton);
document.getElementById('customerEmail').addEventListener('input', updatePayButton);
document.getElementById('customerPhone').addEventListener('input', updatePayButton);

// ✅ تحميل السلة من localStorage
loadCart();
});

// معالجة الدفع - استخدم POST على نفس الصفحة
async function processPayment() {
const name = document.getElementById('customerName').value.trim();
const email = document.getElementById('customerEmail').value.trim();
const country = document.getElementById('customerCountry').value;
const phoneCode = document.getElementById('phoneCode').value;
const phone = document.getElementById('customerPhone').value.trim();
const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

if (!name || !email || !country || !phone || phone.length < 8) {
showError('يرجى ملء جميع الحقول بشكل صحيح');
return;
}

const payBtn = document.getElementById('payBtn');
payBtn.disabled = true;
payBtn.textContent = '⏳ جاري المعالجة...';

try {
const orderId = 'ORD' + Date.now();
const fullPhone = phoneCode + phone;

// ✅ استخدم POST على نفس الصفحة (لا مشاكل CORS!)
const response = await fetch(window.location.href, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
action: 'payment',
orderId: orderId,
amount: cartData.total,
customerName: name,
customerEmail: email,
customerPhone: fullPhone,
paymentMethod: paymentMethod,
items: cartData.items
})
});

const result = await response.json();

if (result.success) {
const paymentUrl = result.paymentUrl || result.checkoutUrl;
if (paymentUrl) {
showSuccess('✅ جاري نقلك لصفحة الدفع...');
setTimeout(() => {
window.location.href = paymentUrl;
}, 1500);
} else {
throw new Error('لم يتم استقبال رابط الدفع');
}
} else {
throw new Error(result.error || result.message || 'فشلت عملية الدفع');
}

} catch (error) {
showError('❌ خطأ: ' + error.message);
payBtn.disabled = false;
payBtn.textContent = '✅ إتمام الدفع';
}
}

// عرض الأخطاء
function showError(message) {
const errorDiv = document.getElementById('error');
errorDiv.textContent = message;
errorDiv.style.display = 'block';
setTimeout(() => {
errorDiv.style.display = 'none';
}, 5000);
}

// عرض النجاح
function showSuccess(message) {
const successDiv = document.getElementById('success');
successDiv.textContent = message;
successDiv.style.display = 'block';
}

// العودة
function goBack() {
window.history.back();
}
</script>
</body>
</html>
